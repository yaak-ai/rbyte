#@yaml/text-templated-strings

#@ cameras = [
#@     'cam_front_left',
#@     'cam_left_backward',
#@     'cam_right_backward',
#@ ]
---
_target_: rbyte.viz.loggers.RerunLogger
_convert_: all
_recursive_: false
application_id: yaak
recording_name: [meta, input_id]
schema:
  (@=cameras[0]@)/time_stamp:
    _target_: rerun.TimeColumn
    columns:
      timestamp: [data, "meta/ImageMetadata.(@=cameras[0]@)/time_stamp"]
    dtype: datetime64[us]

  safety_score/time_stamp:
    _target_: rerun.TimeColumn
    columns:
      timestamp: [data, mcap//ai/safety_score/clip.end_timestamp]
    dtype: datetime64[us]

  #@ for camera in cameras:
  (@=camera@)/frame_idx:
    _target_: rerun.TimeColumn
    columns:
      sequence: [data, "meta/ImageMetadata.(@=camera@)/frame_idx"]

  (@=camera@):
    - _target_: rerun.Image.columns
      columns:
        buffer: [data, (@=camera@)]

    - static: true
      _target_: rerun.Image.from_fields
      fields:
        format:
          _target_: rerun.components.ImageFormat
          height: 324
          width: 576
          color_model: RGB
          channel_datatype: u8
  #@ end

  speed:
    - _target_: rerun.Scalars.columns
      columns:
        scalars: [data, meta/VehicleMotion/speed]

  safety_score/score:
    - _target_: rerun.Scalars.columns
      columns:
        scalars: [data, mcap//ai/safety_score/score]

  waypoints/xy_normalized:
    - _target_: rerun.Points3D.columns
      columns:
        positions: [data, waypoints/xy_normalized]

  waypoints/WGS84:
    - _target_: rerun.GeoPoints.columns
      columns:
        positions: [data, waypoints/WGS84]

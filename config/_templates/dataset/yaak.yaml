#@yaml/text-templated-strings

#@ drive_queries = {
#@     "Niro098-HQ/2024-06-18--13-39-54": "SELECT * FROM self WHERE time_stamp BETWEEN TIMESTAMP('2024-06-18 13:39:55') AND TIMESTAMP('2024-06-18 13:40:15')"
#@ }

#@ cameras = [
#@     'cam_front_left',
#@     'cam_left_backward',
#@     'cam_right_backward',
#@ ]
---
_target_: rbyte.Dataset.from_config
_recursive_: false
_convert_: all
streams:
  #@ for/end camera in cameras:
  (@=camera@):
    index: meta/ImageMetadata.(@=camera@)/frame_idx
    sources:
      #@ for/end drive in drive_queries:
      (@=drive@):
        _target_: rbyte.streams.video.TorchCodecVideoSource
        source: ${data_dir}/(@=drive@)/(@=camera@).pii.mp4
        custom_frame_mappings: ${data_dir}/(@=drive@)/(@=camera@).pii.mp4.frames.json
        transforms:
          - _target_: torchcodec.transforms.Resize
            size: [324, 576]

samples:
  inputs:
    input_id:
      #@ for/end drive in drive_queries:
      - (@=drive@)

    meta_path:
      #@ for/end drive in drive_queries:
      - "${data_dir}/(@=drive@)/metadata.log"

    meta_query:
      #@ for/end meta_query in drive_queries.values():
      - (@=meta_query@)

    mcap_path:
      #@ for/end drive in drive_queries:
      - "${data_dir}/(@=drive@)/ai.mcap"

    route_path:
      #@ for/end drive in drive_queries:
      - "${data_dir}/(@=drive@)/map-matched.json"

    #@ for/end camera in cameras:
    (@=camera@)_path:
      #@ for/end drive in drive_queries:
      - ${data_dir}/(@=drive@)/(@=camera@).pii.mp4

  parallel: false
  pipeline:
    _target_: pipefunc.Pipeline
    validate_type_annotations: false
    functions:
      - _target_: pipefunc.PipeFunc
        renames:
          path: meta_path
        output_name: meta_raw
        mapspec: "${.renames.path}[i] -> ${.output_name}[i]"
        func:
          _target_: rbyte.samples.yaak.YaakMetadataReader
          messages:
            ImageMetadata:
              time_stamp:
                _target_: polars.Datetime
                time_unit: us

              frame_idx:
                _target_: polars.Int32

              camera_name:
                _target_: polars.Enum
                categories:
                  - cam_front_center
                  - cam_front_left
                  - cam_front_right
                  - cam_left_forward
                  - cam_right_forward
                  - cam_left_backward
                  - cam_right_backward
                  - cam_rear

            VehicleMotion:
              time_stamp:
                _target_: polars.Datetime
                time_unit: us

              speed:
                _target_: polars.Float32

            Gnss:
              time_stamp:
                _target_: polars.Datetime
                time_unit: us

              latitude:
                _target_: polars.Float64

              longitude:
                _target_: polars.Float64

              heading:
                _target_: polars.Float64

      - _target_: pipefunc.PipeFunc
        renames:
          left: meta_raw
          right: meta_query
        output_name: meta
        mapspec: "${.renames.left}[i], ${.renames.right}[i] -> ${.output_name}[i]"
        func:
          _target_: rbyte.samples.tree.TreeBroadcastMap
        bound:
          func:
            _target_: hydra.utils.get_method
            path: polars.DataFrame.sql

      #@ for/end camera in cameras:
      - _target_: pipefunc.PipeFunc
        renames:
          path: (@=camera@)_path
        output_name: (@=camera@)_meta
        mapspec: "${.renames.path}[i] -> ${.output_name}[i]"
        func:
          _target_: rbyte.samples.video.VideoFrameIndexer
          fields:
            frame_idx:
              _target_: polars.Int32

      - _target_: pipefunc.PipeFunc
        renames:
          path: mcap_path
        output_name: mcap
        mapspec: "${.renames.path}[i] -> ${.output_name}[i]"
        func:
          _target_: rbyte.samples.mcap.McapReader
          decoder_factories: [rbyte.samples.mcap.ProtobufDecoderFactory]
          fields:
            /ai/safety_score:
              clip.end_timestamp:
                _target_: polars.Datetime
                time_unit: us

              score:
                _target_: polars.Float32

      - _target_: pipefunc.PipeFunc
        renames:
          mapping: meta_raw
        output_name: gnss
        mapspec: "${.renames.mapping}[i] -> ${.output_name}[i]"
        func:
          _target_: rbyte.samples.tree.TreeSelector
          key_path: [Gnss]

      - _target_: pipefunc.PipeFunc
        output_name: route
        mapspec: "route_path[i] -> ${.output_name}[i]"
        func:
          _target_: makefun.create_function
          func_signature: "build_route(*, route_path)"
          func_impl:
            _target_: rbyte.samples.duckdb.DuckDBQuery
            extensions: [spatial]
            config:
              TimeZone: UTC
            query: |
              WITH coordinates AS (
                SELECT coordinate, ordinality
                FROM read_json_auto($route_path),
                     UNNEST(features[1].geometry.coordinates) WITH ORDINALITY AS coordinates(coordinate, ordinality)
              ),
              route_metric AS (
                SELECT
                  ST_Transform(
                    ST_Point(coordinate[1], coordinate[2]),
                    'EPSG:4326', 'EPSG:25832', always_xy := true
                  ) AS geom,
                  ordinality
                FROM coordinates
              )
              SELECT
                ST_X(geom) AS easting,
                ST_Y(geom) AS northing
              FROM route_metric
              ORDER BY ordinality

      - _target_: pipefunc.PipeFunc
        output_name: gnss_metric
        mapspec: "gnss[i] -> ${.output_name}[i]"
        func:
          _target_: makefun.create_function
          func_signature: "build_gnss_metric(*, gnss)"
          func_impl:
            _target_: rbyte.samples.duckdb.DuckDBQuery
            extensions: [spatial]
            config:
              TimeZone: UTC
            query: |
              WITH projected AS (
                SELECT
                  * EXCLUDE (latitude, longitude),
                  ST_Transform(
                    ST_Point(longitude, latitude),
                    'EPSG:4326', 'EPSG:25832', always_xy := true
                  ) AS geom
                FROM gnss
              )
              SELECT
                time_stamp,
                ST_X(geom) AS easting,
                ST_Y(geom) AS northing,
                heading
              FROM projected
              ORDER BY time_stamp

      - _target_: pipefunc.PipeFunc
        renames:
          gnss: gnss_metric
        output_name: waypoints
        mapspec: "route[i], ${.renames.gnss}[i] -> ${.output_name}[i]"
        func:
          _target_: rbyte.samples.yaak.RouteWaypointGenerator
          config:
            waypoint_offsets_m: [1, 11, 21, 31, 41, 51, 61, 71, 81, 91]
            search:
              preferred_match_radius_m: 100.0
              beam_width: 64
              max_backtrack_m: 5.0
              max_advance_m: 200.0
            weights:
              distance: 1.0
              route_heading: 5.0
              advance: 0.1
              backtrack: 25.0

      - _target_: pipefunc.PipeFunc
        output_name: aligned
        mapspec: "meta[i], mcap[i], waypoints[i] -> ${.output_name}[i]"
        func:
          _target_: makefun.create_function
          func_signature: "align(*, meta, mcap, waypoints)"
          func_impl:
            _target_: rbyte.samples.dataframe.DataFrameAligner
            separator: /
            fields:
              meta:
                ImageMetadata.(@=cameras[0]@):
                  key: time_stamp

                #@ for/end camera in cameras[1:]:
                ImageMetadata.(@=camera@):
                  key: time_stamp
                  columns:
                    frame_idx:
                      method: asof
                      tolerance: 20ms
                      strategy: nearest

                VehicleMotion:
                  key: time_stamp
                  columns:
                    speed:
                      method: interp

              mcap:
                /ai/safety_score:
                  key: clip.end_timestamp
                  columns:
                    clip.end_timestamp:
                      method: asof
                      tolerance: 500ms
                      strategy: nearest
                    score:
                      method: asof
                      tolerance: 500ms
                      strategy: nearest

              waypoints:
                key: time_stamp
                columns:
                  easting:
                    method: asof
                    tolerance: 500ms
                    strategy: nearest

                  northing:
                    method: asof
                    tolerance: 500ms
                    strategy: nearest

                  heading:
                    method: asof
                    tolerance: 500ms
                    strategy: nearest

                  waypoints/position:
                    method: asof
                    tolerance: 500ms
                    strategy: nearest

      - _target_: pipefunc.PipeFunc
        output_name: filtered
        mapspec: "aligned[i], cam_front_left_meta[i], cam_left_backward_meta[i], cam_right_backward_meta[i] -> ${.output_name}[i]"
        func:
          _target_: makefun.create_function
          func_signature: "filter(*, aligned, cam_front_left_meta, cam_left_backward_meta, cam_right_backward_meta)"
          func_impl:
            _target_: rbyte.samples.duckdb.DuckDBQuery
            extensions: [spatial]
            query: |
              WITH
                base_data AS (
                  SELECT
                    *,
                    ST_Point("waypoints/easting", "waypoints/northing") AS ego_geom,
                    ST_Collect(
                      (
                        SELECT list(
                          ST_Point(position[1], position[2])
                          ORDER BY ordinality
                        )
                        FROM UNNEST(
                          CAST(aligned."waypoints/waypoints/position" AS DOUBLE[][])
                        ) WITH ORDINALITY AS waypoint(position, ordinality)
                      )
                    ) AS waypoints_geom
                  FROM
                    aligned
                    SEMI JOIN cam_front_left_meta
                      ON aligned."meta/ImageMetadata.cam_front_left/frame_idx"
                      = cam_front_left_meta.frame_idx
                    SEMI JOIN cam_left_backward_meta
                      ON aligned."meta/ImageMetadata.cam_left_backward/frame_idx"
                      = cam_left_backward_meta.frame_idx
                    SEMI JOIN cam_right_backward_meta
                      ON aligned."meta/ImageMetadata.cam_right_backward/frame_idx"
                      = cam_right_backward_meta.frame_idx
                  WHERE
                    COLUMNS(*) IS NOT NULL
                    AND "meta/VehicleMotion/speed" > 44
                ),
                normalized_geometries AS (
                  SELECT
                    *,
                    ST_Transform(
                      waypoints_geom,
                      'EPSG:25832', 'EPSG:4326', always_xy := true
                    ) AS WGS84_waypoints_geom,
                    ST_Rotate(
                      ST_Translate(
                        waypoints_geom,
                        -ST_X(ego_geom),
                        -ST_Y(ego_geom)
                      ),
                      radians("waypoints/heading")
                    ) AS normalized_waypoints_geom
                  FROM
                    base_data
                )
              SELECT
                * EXCLUDE (
                  ego_geom,
                  waypoints_geom,
                  WGS84_waypoints_geom,
                  normalized_waypoints_geom
                ),
                (
                  SELECT
                    list(
                      [ST_X(p.point_struct.geom), ST_Y(p.point_struct.geom)]
                      ORDER BY p.point_struct.path
                    )
                  FROM
                    UNNEST(ST_Dump(normalized_waypoints_geom)) AS p(point_struct)
                ) AS "waypoints/xy_normalized",
                (
                  SELECT
                    list(
                      [ST_Y(p.point_struct.geom), ST_X(p.point_struct.geom)]
                      ORDER BY p.point_struct.path
                    )
                  FROM
                    UNNEST(ST_Dump(WGS84_waypoints_geom)) AS p(point_struct)
                ) AS "waypoints/WGS84"
              FROM
                normalized_geometries
              ORDER BY
                "meta/ImageMetadata.cam_front_left/time_stamp";

      - _target_: pipefunc.PipeFunc
        renames:
          input: filtered
        output_name: samples
        mapspec: "${.renames.input}[i] -> ${.output_name}[i]"
        func:
          _target_: rbyte.samples.dataframe.DataFrameDynamicGrouper
          index_column: meta/ImageMetadata.(@=cameras[0]@)/frame_idx
          every: 6i
          period: 6i

      - _target_: pipefunc.PipeFunc
        output_name: samples_cast
        mapspec: "samples[i] -> ${.output_name}[i]"
        func:
          _target_: makefun.create_function
          func_signature: "cast(*, samples)"
          func_impl:
            _target_: rbyte.samples.duckdb.DuckDBQuery
            query: |
              SELECT "meta/ImageMetadata.cam_front_left/time_stamp"::TIMESTAMP[6] AS "meta/ImageMetadata.cam_front_left/time_stamp",
                     "meta/ImageMetadata.cam_front_left/frame_idx"::INT32[6] AS "meta/ImageMetadata.cam_front_left/frame_idx",
                     "meta/ImageMetadata.cam_left_backward/frame_idx"::INT32[6] AS "meta/ImageMetadata.cam_left_backward/frame_idx",
                     "meta/ImageMetadata.cam_right_backward/frame_idx"::INT32[6] AS "meta/ImageMetadata.cam_right_backward/frame_idx",
                     "meta/VehicleMotion/speed"::FLOAT[6] AS "meta/VehicleMotion/speed",
                     "mcap//ai/safety_score/clip.end_timestamp"::TIMESTAMP[6] AS "mcap//ai/safety_score/clip.end_timestamp",
                     "mcap//ai/safety_score/score"::FLOAT[6] AS "mcap//ai/safety_score/score",
                     "waypoints/heading"::FLOAT[6] AS "waypoints/heading",
                     "waypoints/xy_normalized"::FLOAT[2][10][6] AS "waypoints/xy_normalized",
                     "waypoints/WGS84"::DOUBLE[2][10][6] AS "waypoints/WGS84",
              FROM samples
              WHERE len("meta/ImageMetadata.cam_front_left/frame_idx") == 6

      - _target_: pipefunc.PipeFunc
        renames:
          keys: input_id
          values: samples_cast
        output_name: samples_aggregated
        func:
          _target_: rbyte.samples.dataframe.DataFrameConcatenator
          key_column: input_id

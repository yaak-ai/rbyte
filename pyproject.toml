[project]
name = "rbyte"
version = "0.39.0"
description = "Multimodal PyTorch dataset library"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license-files = ["LICENSE.txt"]
authors = [{ name = "Evgenii Gorchakov", email = "evgenii@yaak.ai" }]
maintainers = [{ name = "Evgenii Gorchakov", email = "evgenii@yaak.ai" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cachetools>=7.1.4",
  "checkedframe>=0.1.0",
  "duckdb>=1.5.4",
  "hydra-core>=1.3.3",
  "more-itertools>=11.1.0",
  "numpy",
  "optree>=0.19.1",
  "pipefunc>=0.93.1",
  "polars>=1.41.2",
  "pydantic>=2.13.4",
  "structlog>=26.1.0",
  "tensordict>=0.13.0",
  "torch",
  "torchdata>=0.11.0",
  "tqdm>=4.67.1",
  "xxhash>=3.7.0",
]

[project.urls]
repo = "https://github.com/yaak-ai/rbyte"

[project.scripts]
rbyte-benchmark-dataloader = "rbyte.scripts.benchmark_dataloader:main"
rbyte-visualize = "rbyte.scripts.visualize:main"

[project.optional-dependencies]
hdf5 = ["h5py>=3.14.0"]
jpeg = ["simplejpeg>=1.9.0"]
mcap = [
  "mcap>=1.3.1",
  "mcap-protobuf-support>=0.5.4",
  "ptars>=0.0.17",
  "protobuf>=7.35.1,<8",
]
video = ["torchcodec>=0.14.0"]
visualize = [
  "einops>=0.8.2",
  "rerun-sdk[notebook]>=0.33.1",
]
yaak = [
  "m2df",
  "ymmv",
]

[dependency-groups]
dev = [
  "better-exceptions>=0.3.3",
  "graphviz-anywidget>=0.8.0",
  "ipython>=9.10.0",
  "ipython-autoimport>=0.5.1",
  "jupyterlab>=4.4.5",
  "jupyterlab-vim>=4.1.4",
  "lovely-tensors>=0.1.19",
  "patdb>=0.1.2",
  "pipefunc[plotting]",
  "wat-inspector>=0.4.3",
  { include-group = "check" },
  { include-group = "test" },
]
check = [
  "ruff>=0.15.22",
  "ty>=0.0.61",
]
test = [
  "dill>=0.4.1",
  "makefun>=1.16.0",
  "pytest>=9.1.1",
  "pytest-lazy-fixtures>=1.4.0",
  "testbook>=0.4.2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib", "-ra", "-vv"]
testpaths = ["tests"]

[tool.ruff]
output-format = "grouped"
preview = true
unsafe-fixes = true
target-version = "py312"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "CPY",
  "TD",
  "missing-trailing-comma",
  "builtin-argument-shadowing",
  "builtin-variable-shadowing"
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert"]

[tool.tombi]
files.exclude = ["**/Cargo.lock"]
schema.strict = false

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.uv]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]

[tool.uv.sources]
m2df = { git = "ssh://git@github.com/yaak-ai/ydks.git", subdirectory = "crates/m2df" }
ymmv = { git = "ssh://git@github.com/yaak-ai/ydks.git", subdirectory = "crates/ymmv" }
